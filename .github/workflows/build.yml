name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $project = Get-Content CMakeLists.txt -Raw
          $version = [regex]::Match($project, 'project\(D2SteamFix VERSION (\d+\.\d+\.\d+)\b')
          if (-not $version.Success -or $env:RELEASE_TAG -cne "v$($version.Groups[1].Value)") {
            throw "Release tag must match the CMake project version (vX.Y.Z)."
          }

      - name: Configure
        run: |
          $coverage = if ('${{ matrix.configuration }}' -eq 'Debug') { 'ON' } else { 'OFF' }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSTEAMFIX_ENABLE_CODE_ANALYSIS=ON "-DSTEAMFIX_ENABLE_COVERAGE=$coverage"

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Test
        if: matrix.configuration != 'Debug'
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure --no-tests=error

      - name: Install coverage tool
        if: matrix.configuration == 'Debug'
        run: choco install opencppcoverage --version 0.9.9.0 --yes --no-progress

      - name: Test with production line coverage
        if: matrix.configuration == 'Debug'
        run: ./cmake/RunCoverage.ps1 -BuildDirectory build

      - name: Upload coverage report
        if: always() && matrix.configuration == 'Debug'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: steamfix-windows-x64-coverage
          path: build/coverage/
          if-no-files-found: error

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: steamfix-windows-x64-${{ matrix.configuration }}
          path: build/${{ matrix.configuration }}/steamfix.exe
          if-no-files-found: error
